api_name: "torch.mul"
category: "mul"

shape_vars:
  N: [1, 8]
  D: [1, 256]

params:
  input:
    kind: "tensor_or_scalar"
    shape_spec: ["N", "D"]
    dtype_choices: ["float32", "float64", "int64"]
  other:
    kind: "tensor_or_scalar"
    shape_spec: ["N", "D"]
    dtype_choices: ["float32", "float64", "int64"]

constraints:
  - "not isinstance(input, torch.Tensor) or input.shape == (N, D)"
  - "not isinstance(other, torch.Tensor) or other.shape == (N, D)"

