api_name: "torch.nn.functional.conv2d"
category: "conv2d"

shape_vars:
  N:   [1, 8]      # batch size
  C_in:  [1, 64]   # in_channels
  C_out: [1, 64]   # out_channels
  H:   [8, 64]     # input height
  W:   [8, 64]     # input width
  kH:  [1, 5]      # kernel height
  kW:  [1, 5]      # kernel width
  C_per_group: [1, 64]

params:
  input:
    kind: "tensor"
    shape_spec: ["N", "C_in", "H", "W"]
    dtype_choices: ["float32", "float64", "complex64"]
  weight:
    kind: "tensor"
    # 这里用一个显式的中间变量 C_per_group，约束里再绑定 C_in / groups
    shape_spec: ["C_out", "C_per_group", "kH", "kW"]
    dtype_choices: ["float32", "float64", "complex64"]
  bias:
    kind: "tensor_optional"
    shape_spec: ["C_out"]
    dtype_choices: ["float32", "float64", "complex64"]
  stride:
    kind: "int_or_tuple"
    values: [1, 2, 3]        
  padding:
    kind: "int_or_tuple"
    values: [0, 1, 2, [1, 1], [2, 2]]
  dilation:
    kind: "int_or_tuple"
    values: [1, 2, 3]
  groups:
    kind: "int"
    range: [1, 16]

constraints:
  # 通道 / groups 关系
  - "C_in % groups == 0"
  - "C_out % groups == 0"
  - "C_per_group * groups == C_in"

  # 形状一致性
  - "input.shape == (N, C_in, H, W)"
  - "weight.shape == (C_out, C_per_group, kH, kW)"
  - "bias is None or bias.shape == (C_out,)"

  # 步长 / 膨胀 / padding 的基本合法性（更细可以留给后续）
  - "all(isinstance(p, int) and p >= 0 for p in padding_tuple)"
  - "all(isinstance(s, int) and s >= 1 for s in stride_tuple)"
  - "all(isinstance(d, int) and d >= 1 for d in dilation_tuple)"
