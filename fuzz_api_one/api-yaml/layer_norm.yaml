api_name: "torch.nn.functional.layer_norm"
category: "layer_norm"

shape_vars:
  N: [1, 8]
  D: [1, 256]

params:
  input:
    kind: "tensor"
    shape_spec: ["N", "D"]
    dtype_choices: ["float32", "float64"]
  normalized_shape:
    kind: "int"
    range: [1, 256]
  weight:
    kind: "tensor_optional"
    shape_spec: ["D"]
    dtype_choices: ["float32", "float64"]
  bias:
    kind: "tensor_optional"
    shape_spec: ["D"]
    dtype_choices: ["float32", "float64"]
  eps:
    kind: "float"
    range: [1.0e-06, 1.0e-03]

constraints:
  - "input.shape == (N, D)"
  - "D == normalized_shape"
  - "weight is None or weight.shape == (D,)"
  - "bias is None or bias.shape == (D,)"
  - "eps > 0.0"

